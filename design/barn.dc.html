<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Barnets skærm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFF6E9;font-family:'Nunito',system-ui,sans-serif;color:#22304A;padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden">

  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:46px;height:46px;border-radius:50%;background:#0B7A70;color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center">E</div>
    <div style="flex:1">
      <div style="font-size:22px;font-weight:900;line-height:1.1">Hej Emil</div>
      <div style="font-size:14px;font-weight:700;color:#55627A">Torsdag, uge 47</div>
    </div>
  </div>

  <div style="background:#0B7A70;color:#fff;border-radius:28px;padding:18px 18px 18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-size:14px;font-weight:700;color:#D7F3EF">Du har tjent</div>
      <div style="font-size:50px;font-weight:900;line-height:1">{{balanceText}}</div>
      <sc-if value="{{hasWait}}" hint-placeholder-val="{{ true }}">
        <div style="align-self:flex-start;background:#FFC247;color:#22304A;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800">+{{waitText}} venter</div>
      </sc-if>
    </div>
    <div style="position:relative;width:96px;height:96px;flex:none">
      <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="48" cy="48" r="38" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="10"></circle>
        <circle cx="48" cy="48" r="38" fill="none" stroke="#FFC247" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{ringDash}}" transform="rotate(-90 48 48)"></circle>
      </svg>
      <div style="position:absolute;left:0;top:0;width:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:24px;font-weight:900;line-height:1">{{doneCount}}/8</div>
        <div style="font-size:12px;font-weight:700;color:#D7F3EF">i ugen</div>
      </div>
    </div>
  </div>

  <div style="background:#fff;border-radius:22px;padding:12px 16px 10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <div style="font-size:15px;font-weight:800">Din uge</div>
      <div style="font-size:13px;font-weight:700;color:#55627A">Mål: 8 opgaver</div>
    </div>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;height:70px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:32px">
          <div style="width:100%;height:{{b.h}}px;border-radius:8px;background:{{b.bg}}"></div>
          <div style="font-size:12px;color:#55627A;font-weight:{{b.weight}}">{{b.label}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="font-size:17px;font-weight:900;margin-top:2px">Dine opgaver</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:-6px">
    <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:9px 10px 9px 14px">
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:800;line-height:1.2">{{t.title}}</div>
          <div style="font-size:13px;color:#55627A;font-weight:600">{{t.room}}</div>
        </div>
        <div style="font-size:15px;font-weight:900;color:#0B7A70;background:#E3F4F1;border-radius:12px;padding:6px 9px">{{t.priceText}}</div>
        <sc-if value="{{t.isTodo}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{t.finish}}" style="border:0;background:#0B7A70;color:#fff;font-size:15px;font-weight:800;height:44px;min-width:78px;border-radius:14px">Færdig</button>
        </sc-if>
        <sc-if value="{{t.isWait}}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:6px;background:#FFE7B0;color:#22304A;border-radius:14px;height:44px;min-width:78px;justify-content:center;font-size:13px;font-weight:800">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22304A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            Venter
          </div>
        </sc-if>
        <sc-if value="{{t.isDone}}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:6px;background:#D7F3EF;color:#0B5F57;border-radius:14px;height:44px;min-width:78px;justify-content:center;font-size:13px;font-weight:800">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B5F57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4L19 7"></path></svg>
            Godkendt
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{hasJobs}}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
      <div style="font-size:17px;font-weight:900">Ledige nu</div>
      <div style="background:#C73A30;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900">Ny</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:-6px">
      <sc-for list="{{jobs}}" as="o" hint-placeholder-count="1">
        <div style="display:flex;align-items:center;gap:10px;background:#FFFBF2;border:2px dashed #0B7A70;border-radius:20px;padding:7px 8px 7px 14px">
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:800;line-height:1.2">{{o.title}}</div>
            <div style="font-size:13px;color:#55627A;font-weight:600">{{o.note}}</div>
          </div>
          <div style="font-size:15px;font-weight:900;color:#0B7A70;background:#E3F4F1;border-radius:12px;padding:6px 9px">{{o.priceText}}</div>
          <button onClick="{{o.take}}" style="border:2px solid #0B7A70;background:#fff;color:#0B7A70;font-size:15px;font-weight:800;height:44px;min-width:78px;border-radius:14px">Tag den</button>
        </div>
      </sc-for>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tasks = s.tasks || [
      { id: 1, title: 'Tøm opvaskemaskinen', room: 'Køkken', price: 5, status: 'todo' },
      { id: 2, title: 'Sæt skraldespanden ud', room: 'Hele huset', price: 10, status: 'todo' },
      { id: 3, title: 'Ryd dit værelse', room: 'Dit værelse', price: 15, status: 'wait' },
      { id: 4, title: 'Dæk bord', room: 'Køkken', price: 3, status: 'done' }
    ];
    const jobs = s.jobs || [
      { id: 5, title: 'Hæng vasketøjet op', room: 'Bryggers', note: 'Vaskemaskinen er færdig', price: 8 }
    ];
    const base = 56;
    const approved = tasks.filter(t => t.status === 'done').reduce((a, t) => a + t.price, 0);
    const waiting = tasks.filter(t => t.status === 'wait').reduce((a, t) => a + t.price, 0);
    const todayCount = tasks.filter(t => t.status !== 'todo').length;
    const completed = 3 + todayCount;
    const circ = 238.76;
    const dash = (circ * Math.min(1, completed / 8)).toFixed(1) + ' ' + circ;
    const week = [
      { label: 'Man', n: 2 }, { label: 'Tir', n: 1 }, { label: 'Ons', n: 0 },
      { label: 'Tor', n: todayCount, today: true },
      { label: 'Fre', n: 0, future: true }, { label: 'Lør', n: 0, future: true }, { label: 'Søn', n: 0, future: true }
    ];
    const bars = week.map(d => ({
      label: d.label,
      h: 8 + d.n * 14,
      bg: d.today ? '#FFC247' : (d.future || d.n === 0 ? '#E8DFD0' : '#0B7A70'),
      weight: d.today ? 900 : 600
    }));
    const taskItems = tasks.map(t => ({
      id: t.id, title: t.title, room: t.room,
      priceText: t.price + ' kr',
      isTodo: t.status === 'todo', isWait: t.status === 'wait', isDone: t.status === 'done',
      finish: () => this.setState({ tasks: tasks.map(x => x.id === t.id ? Object.assign({}, x, { status: 'wait' }) : x), jobs })
    }));
    const jobItems = jobs.map(o => ({
      id: o.id, title: o.title, note: o.note,
      priceText: o.price + ' kr',
      take: () => this.setState({
        jobs: jobs.filter(j => j.id !== o.id),
        tasks: tasks.concat([{ id: o.id, title: o.title, room: o.room, price: o.price, status: 'todo' }])
      })
    }));
    return {
      balanceText: (base + approved) + ' kr',
      waitText: waiting + ' kr',
      hasWait: waiting > 0,
      doneCount: completed,
      ringDash: dash,
      bars: bars,
      tasks: taskItems,
      jobs: jobItems,
      hasJobs: jobItems.length > 0
    };
  }
}
</script>
</body>
</html>
