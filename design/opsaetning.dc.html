<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Opsætning af opgaver</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFF6E9;font-family:'Nunito',system-ui,sans-serif;color:#22304A;padding:20px 20px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden">

  <div>
    <div style="font-size:24px;font-weight:900;line-height:1.1">Opsæt opgaver</div>
    <div style="font-size:14px;font-weight:700;color:#55627A;margin-top:2px">Fundet i dit hjem: Køkken, Bryggers, Badeværelse, Have</div>
  </div>

  <div style="display:flex;gap:8px;align-items:center">
    <div style="font-size:13px;font-weight:800;color:#55627A">Forslag til</div>
    <div style="background:#0B7A70;color:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:800">Emil · 8 år</div>
    <div style="background:#fff;color:#22304A;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:800">Maja · 12 år</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="font-size:14px;font-weight:900;color:#55627A;text-transform:uppercase;letter-spacing:0.04em;margin-top:4px">{{g.room}}</div>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:8px 12px 8px 14px;min-height:46px">
            <div style="flex:1;min-width:0">
              <div style="font-size:15px;font-weight:800;line-height:1.2">{{r.title}}</div>
              <div style="font-size:13px;color:#55627A;font-weight:600">{{r.sub}}</div>
            </div>
            <div style="font-size:15px;font-weight:900;color:#0B7A70">{{r.priceText}}</div>
            <button role="switch" aria-checked="{{r.checked}}" aria-label="{{r.label}}" onClick="{{r.toggle}}" style="width:56px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center">
              <span style="display:block;position:relative;width:52px;height:30px;border-radius:999px;background:{{r.trackBg}}">
                <span style="position:absolute;top:3px;left:{{r.knobLeft}}px;width:24px;height:24px;border-radius:50%;background:#fff"></span>
              </span>
            </button>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{showForm}}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff;border:2px dashed #0B7A70;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
      <label style="font-size:13px;font-weight:800;color:#55627A" for="ny-navn">Navn på opgaven</label>
      <input id="ny-navn" type="text" value="{{draftTitle}}" onInput="{{setTitle}}" placeholder="Fx Fodr kaninen" style="height:44px;box-sizing:border-box;border-radius:12px;border:2px solid #D9CFBE;padding:0 12px;font-size:16px;font-weight:700;color:#22304A">
      <div style="display:flex;gap:10px;align-items:flex-end">
        <div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <label style="font-size:13px;font-weight:800;color:#55627A" for="ny-pris">Pris i kr.</label>
          <input id="ny-pris" type="text" inputmode="numeric" value="{{draftPrice}}" onInput="{{setPrice}}" style="height:44px;box-sizing:border-box;width:100%;border-radius:12px;border:2px solid #D9CFBE;padding:0 12px;font-size:16px;font-weight:700;color:#22304A">
        </div>
        <button onClick="{{addOwn}}" style="height:44px;padding:0 18px;border:0;border-radius:14px;background:#0B7A70;color:#fff;font-size:15px;font-weight:800">Tilføj</button>
      </div>
    </div>
  </sc-if>

  <button onClick="{{toggleForm}}" style="height:48px;border-radius:18px;border:2px dashed #0B7A70;background:transparent;color:#0B7A70;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7A70" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Skriv din egen opgave
  </button>

  <div style="margin-top:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:13px;font-weight:700;color:#55627A;text-align:center">{{countText}} valgt</div>
    <button onClick="{{save}}" style="height:52px;border:0;border-radius:18px;background:{{saveBg}};color:{{saveFg}};font-size:16px;font-weight:900">{{saveText}}</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const rows = s.rows || [
      { id: 1, room: 'Køkken', title: 'Tøm opvaskemaskinen', sub: 'Opvaskemaskine fundet', price: 5, on: true },
      { id: 2, room: 'Køkken', title: 'Dæk bord', sub: 'Dagligt', price: 3, on: true },
      { id: 3, room: 'Køkken', title: 'Tør køkkenbordet af', sub: 'Dagligt', price: 3, on: false },
      { id: 4, room: 'Bryggers', title: 'Hæng vasketøjet op', sub: 'Vaskemaskine fundet · melder selv', price: 8, on: true },
      { id: 5, room: 'Badeværelse', title: 'Ryd badeværelset', sub: 'Ugentligt', price: 6, on: false },
      { id: 6, room: 'Have', title: 'Sæt skraldespanden ud', sub: 'Skraldedag: torsdag', price: 10, on: true }
    ];
    const showForm = !!s.showForm;
    const draftTitle = s.draftTitle || '';
    const draftPrice = s.draftPrice === undefined ? '5' : s.draftPrice;
    const saved = !!s.saved;

    const order = [];
    rows.forEach(r => { if (order.indexOf(r.room) < 0) order.push(r.room); });
    const groups = order.map(room => ({
      room: room,
      rows: rows.filter(r => r.room === room).map(r => ({
        title: r.title, sub: r.sub,
        priceText: r.price + ' kr',
        checked: r.on ? 'true' : 'false',
        label: r.title,
        trackBg: r.on ? '#0B7A70' : '#B9B2A4',
        knobLeft: r.on ? 25 : 3,
        toggle: () => this.setState({ rows: rows.map(x => x.id === r.id ? Object.assign({}, x, { on: !x.on }) : x), saved: false })
      }))
    }));
    const count = rows.filter(r => r.on).length;
    return {
      groups: groups,
      showForm: showForm,
      draftTitle: draftTitle,
      draftPrice: draftPrice,
      setTitle: e => this.setState({ draftTitle: e.target.value }),
      setPrice: e => this.setState({ draftPrice: e.target.value }),
      toggleForm: () => this.setState({ showForm: !showForm }),
      addOwn: () => {
        const title = draftTitle.trim();
        if (!title) return;
        const price = parseInt(draftPrice, 10) || 0;
        this.setState({
          rows: rows.concat([{ id: Date.now(), room: 'Dine egne', title: title, sub: 'Skrevet af dig', price: price, on: true }]),
          draftTitle: '', showForm: false, saved: false
        });
      },
      countText: count + (count === 1 ? ' opgave' : ' opgaver'),
      save: () => this.setState({ saved: true }),
      saveText: saved ? 'Gemt. Links er klar til børnene' : 'Gem og send links til børnene',
      saveBg: saved ? '#D7F3EF' : '#0B7A70',
      saveFg: saved ? '#0B5F57' : '#ffffff'
    };
  }
}
</script>
</body>
</html>
