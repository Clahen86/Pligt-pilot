<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pligter">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Mine pligter</title>
<style>
:root { --accent: #0B7A70; --ink: #22304A; --muted: #55627A; --cream: #FFF6E9; --sun: #FFC247; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--cream); color: var(--ink);
  font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; min-height: 100dvh;
  padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; cursor: pointer; }
.top { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff;
  font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex: none; }
.hello { font-size: 22px; font-weight: 900; line-height: 1.1; }
.sub { font-size: 14px; font-weight: 700; color: var(--muted); }
.hero { background: var(--accent); color: #fff; border-radius: 28px; padding: 18px 18px 18px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero .label { font-size: 14px; font-weight: 700; opacity: .9; }
.hero .big { font-size: 50px; font-weight: 900; line-height: 1; margin: 6px 0; }
.chip { display: inline-block; background: var(--sun); color: var(--ink); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; font-weight: 800; }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { display: block; }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .mid b { font-size: 24px; font-weight: 900; line-height: 1; }
.ring .mid span { font-size: 12px; font-weight: 700; opacity: .9; }
.card { background: #fff; border-radius: 22px; padding: 12px 16px 10px; }
.card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.card .row b { font-size: 15px; font-weight: 800; }
.card .row span { font-size: 13px; font-weight: 700; color: var(--muted); }
.bars { display: flex; align-items: flex-end; justify-content: space-between; height: 70px; }
.bar { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 32px; }
.bar i { display: block; width: 100%; border-radius: 8px; }
.bar small { font-size: 12px; color: var(--muted); font-weight: 600; }
.meter { height: 14px; border-radius: 999px; background: #E8DFD0; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--accent); min-width: 6px; }
.pet { display: flex; align-items: center; gap: 12px; }
.petart { flex: none; }
.petinfo { flex: 1; min-width: 0; }
.petinfo b { font-size: 17px; font-weight: 900; }
.boss .bossrow { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.tradeform { display: flex; flex-direction: column; gap: 8px; border: 2px dashed var(--accent); }
.tradeform label { font-size: 13px; font-weight: 800; color: var(--muted); }
.tradeform select, .tradeform input { height: 44px; border-radius: 12px; border: 2px solid #D9CFBE; padding: 0 12px; font: inherit; font-size: 16px; font-weight: 700; color: var(--ink); background: #fff; }
.row2 { display: flex; gap: 8px; }
.row2 .btn { flex: 1; }
.btn.small { height: 36px; min-width: 0; padding: 0 10px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bar.today small { font-weight: 900; color: var(--ink); }
h2 { font-size: 17px; font-weight: 900; margin: 10px 0 0; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
.new { background: #C73A30; color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 900; }
.list { display: flex; flex-direction: column; gap: 8px; }
.task { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 20px; padding: 9px 10px 9px 14px; }
.task.open { background: #FFFBF2; border: 2px dashed var(--accent); padding: 7px 8px 7px 14px; }
.task .t { flex: 1; min-width: 0; }
.task .t b { display: block; font-size: 15px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.task .t span { font-size: 13px; color: var(--muted); font-weight: 600; }
.price { font-size: 15px; font-weight: 900; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, #fff);
  border-radius: 12px; padding: 6px 9px; white-space: nowrap; }
.btn { border: 0; background: var(--accent); color: #fff; font-size: 15px; font-weight: 800; height: 44px; min-width: 78px; border-radius: 14px; }
.btn.ghost { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
.state { display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; min-width: 78px;
  border-radius: 14px; font-size: 13px; font-weight: 800; padding: 0 8px; }
.state.wait { background: #FFE7B0; }
.state.done { background: color-mix(in srgb, var(--accent) 16%, #fff); color: var(--ink); }
.empty { background: #fff; border-radius: 20px; padding: 18px 16px; font-size: 15px; font-weight: 700; color: var(--muted); }
.err { background: #FDE4E1; color: #7A1F18; border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 700; }
.err[hidden] { display: none; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="err" id="err" hidden role="status">Kan ikke nå huset lige nu. Prøver igen…</div>
  <input id="pick" type="file" accept="image/*" capture="environment" hidden aria-hidden="true">
<div id="app"></div>
</main>
<script>
(function () {
  var state = null, busy = false, tradeOpen = '';
  var app = document.getElementById('app'), errBox = document.getElementById('err');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function call(path, post, body) {
    var opt = post ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) } : {};
    return fetch(path, opt).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) { throw new Error(j.error || 'Fejl'); }
        return j;
      });
    });
  }

  function load() {
    return call('api/state').then(function (s) {
      state = s; errBox.hidden = true; render();
    }).catch(function () { errBox.hidden = false; });
  }

  function act(path, body) {
    if (busy) { return; }
    busy = true;
    call(path, true, body).then(function (s) { state = s; errBox.hidden = true; render(); })
      .catch(function (e) { errBox.textContent = e.message; errBox.hidden = false; setTimeout(load, 1500); })
      .then(function () { busy = false; });
  }

  var CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4L19 7"></path></svg>';
  var CLOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>';

  function render() {
    if (!state) { return; }
    var s = state, k = s.kid;
    document.documentElement.style.setProperty('--accent', k.color);
    document.title = k.name + ' – pligter';
    var circ = 238.76, frac = Math.min(1, s.completed / s.goal);
    var bars = s.bars.map(function (b) {
      var bg = b.today ? 'var(--sun)' : (b.future || b.n === 0 ? '#E8DFD0' : 'var(--accent)');
      return '<div class="bar' + (b.today ? ' today' : '') + '"><i style="height:' + (8 + b.n * 14) +
        'px;background:' + bg + '"></i><small>' + esc(b.label) + '</small></div>';
    }).join('');
    var items = s.items.map(function (i) {
      var sub = i.rejected && i.status === 'todo' ? 'Prøv igen' : i.room;
      if (i.of > 1) { sub = (sub ? sub + ' · ' : '') + i.slot + ' af ' + i.of; }
      if (i.streak > 0 && i.status === 'todo') { sub = (sub ? sub + ' · ' : '') + i.streak + ' i træk'; }
      var right = i.status === 'todo' && i.need_photo
        ? '<button class="btn" data-pick="' + i.id + '" aria-label="Tag foto af: ' + esc(i.title) + '">Tag foto</button>'
        : i.status === 'todo'
        ? '<button class="btn" data-done="' + i.id + '" aria-label="Færdig: ' + esc(i.title) + '">Færdig</button>'
        : i.status === 'wait'
          ? '<div class="state wait">' + CLOCK + 'Venter</div>'
          : '<div class="state done">' + CHECK + 'Godkendt</div>';
      var swap = i.status === 'todo' && s.trading && s.siblings.length && !i.need_photo
        ? '<button class="btn ghost small" data-trade="' + i.id + '" aria-label="Byt: ' + esc(i.title) + '">Byt</button>' : '';
      return '<div class="task"><div class="t"><b>' + esc(i.title) + '</b><span>' + esc(sub) +
        '</span></div><div class="price">' + i.price + ' kr</div>' + swap + right + '</div>' +
        (tradeOpen === i.id ? tradeForm(i, s) : '');
    }).join('');
    var jobs = s.jobs.map(function (j) {
      return '<div class="task open"><div class="t"><b>' + esc(j.title) + '</b><span>' +
        esc(j.expires ? 'Overraskelse! Slutter kl. ' + j.expires.slice(11, 16) : (j.room || 'Først til mølle')) + '</span></div><div class="price">' + j.price +
        ' kr</div><button class="btn ghost" data-claim="' + j.task_id + '">Tag den</button></div>';
    }).join('');
    app.innerHTML =
      '<div class="top"><div class="avatar" aria-hidden="true">' + esc(k.name.charAt(0).toUpperCase()) + '</div>' +
      '<div><div class="hello">Hej ' + esc(k.name) + '</div><div class="sub">' + esc(s.week_label) + '</div></div></div>' +
      '<div class="hero"><div><div class="label">Du har tjent</div><div class="big">' + s.balance + ' kr</div>' +
      (s.waiting > 0 ? '<span class="chip">+' + s.waiting + ' kr venter</span>' : '') + '</div>' +
      '<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">' +
      '<circle cx="48" cy="48" r="38" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"></circle>' +
      '<circle cx="48" cy="48" r="38" fill="none" stroke="#FFC247" stroke-width="10" stroke-linecap="round" ' +
      'stroke-dasharray="' + (circ * frac).toFixed(1) + ' ' + circ + '" transform="rotate(-90 48 48)"></circle></svg>' +
      '<div class="mid"><b>' + s.completed + '/' + s.goal + '</b><span>i ugen</span></div></div></div>' +
      (s.birthday_today ? '<div class="card"><b>Tillykke med fødselsdagen, ' + esc(k.name) + '!</b><div class="sub">Du er ' + k.age + ' år i dag.</div></div>' : '') +
      (s.paused ? '<div class="card"><b>Du har pause</b><div class="sub">Ingen opgaver lige nu. God fornøjelse!</div></div>' : '') +
      pushCard() +
      characterCard(s) +
      bossCard(s.boss) +
      tradeCards(s) +
      saving(s) +
      goalCard(s.family, 'Familiens mål') +
      (s.badges && s.badges.length ? '<div class="chips">' + s.badges.map(function (b) { return '<span class="chip">' + esc(b.title) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="card"><div class="row"><b>Din uge</b><span>Mål: ' + s.goal + ' opgaver</span></div>' +
      '<div class="bars">' + bars + '</div></div>' +
      '<h2>Dine opgaver</h2><div class="list">' +
      (items || '<div class="empty">Ingen opgaver lige nu. Godt gået!</div>') + '</div>' +
      (jobs ? '<h2>Ledige nu <span class="new">Ny</span></h2><div class="list">' + jobs + '</div>' : '');
  }

  function goalCard(g, prefix) {
    if (!g) { return ''; }
    var pct = Math.round(100 * g.saved / g.amount);
    return '<div class="card"><div class="row"><b>' + (prefix ? esc(prefix) + ': ' : '') + esc(g.title) + '</b><span>' + g.saved + ' af ' + g.amount + ' kr</span></div>' +
      '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="' + g.amount + '" aria-valuenow="' + g.saved + '"><i style="width:' + pct + '%"></i></div>' +
      (g.reached ? '<div class="sub" style="margin-top:6px">Målet er nået! Sig det til mor eller far.</div>' : '') + '</div>';
  }
  // ---- karakter og boss ----
  function badgeSet(s) { var o = {}; (s.badges || []).forEach(function (b) { o[b.id] = true; }); return o; }
  function character(s) {
    var lv = s.level.n, has = badgeSet(s), col = s.kid.color, ink = '#22304A', sun = '#FFC247';
    var svg = '<svg viewBox="0 0 120 120" width="104" height="104" role="img" aria-label="Din pligtfugl, niveau ' + lv + '">';
    if (has.n50) { svg += '<path d="M34 62 Q60 112 86 62 L92 100 Q60 118 28 100 Z" fill="#C73A30"></path>'; }
    if (lv === 1) {
      svg += '<ellipse cx="60" cy="68" rx="32" ry="40" fill="#FFF" stroke="' + ink + '" stroke-width="3"></ellipse>' +
        '<path d="M32 66 L44 58 L52 68 L62 56 L72 68 L82 58 L90 66" fill="none" stroke="' + ink + '" stroke-width="3" stroke-linejoin="round"></path>' +
        '<circle cx="46" cy="90" r="5" fill="' + col + '"></circle><circle cx="74" cy="84" r="4" fill="' + col + '"></circle><circle cx="62" cy="96" r="3" fill="' + col + '"></circle>';
    } else {
      if (lv >= 3) { svg += '<ellipse cx="26" cy="74" rx="9" ry="16" fill="' + col + '" transform="rotate(20 26 74)"></ellipse><ellipse cx="94" cy="74" rx="9" ry="16" fill="' + col + '" transform="rotate(-20 94 74)"></ellipse>'; }
      svg += '<ellipse cx="60" cy="68" rx="34" ry="34" fill="' + col + '"></ellipse>' +
        '<ellipse cx="60" cy="80" rx="22" ry="20" fill="#FFF6E9"></ellipse>' +
        '<circle cx="48" cy="58" r="6" fill="#FFF"></circle><circle cx="72" cy="58" r="6" fill="#FFF"></circle>' +
        '<circle cx="49" cy="59" r="3" fill="' + ink + '"></circle><circle cx="73" cy="59" r="3" fill="' + ink + '"></circle>' +
        '<polygon points="54,68 66,68 60,77" fill="' + sun + '"></polygon>' +
        '<rect x="48" y="100" width="6" height="8" rx="2" fill="' + sun + '"></rect><rect x="66" y="100" width="6" height="8" rx="2" fill="' + sun + '"></rect>';
    }
    if (has.n25 && lv > 1) { svg += '<rect x="39" y="52" width="19" height="12" rx="4" fill="' + ink + '"></rect><rect x="62" y="52" width="19" height="12" rx="4" fill="' + ink + '"></rect><rect x="56" y="55" width="8" height="3" fill="' + ink + '"></rect>'; }
    if (has.n10 && lv > 1) { svg += '<path d="M34 46 Q60 14 86 46 Z" fill="' + ink + '"></path><rect x="30" y="44" width="38" height="6" rx="3" fill="' + ink + '"></rect>'; }
    if (has.hero) { svg += '<polygon points="42,22 48,8 60,20 72,8 78,22" fill="' + sun + '" stroke="' + ink + '" stroke-width="2" stroke-linejoin="round"></polygon>'; }
    if (has.n100 && lv > 1) { svg += '<polygon points="60,84 63,91 71,91 65,96 67,104 60,99 53,104 55,96 49,91 57,91" fill="' + sun + '" stroke="' + ink + '" stroke-width="1.5"></polygon>'; }
    return svg + '</svg>';
  }
  function characterCard(s) {
    var l = s.level, pct = l.next ? Math.round(100 * (l.count - prevNeed(l)) / (l.next - prevNeed(l))) : 100;
    return '<div class="card pet"><div class="petart">' + character(s) + '</div><div class="petinfo"><b>' + esc(l.name) + '</b>' +
      '<div class="sub">Niveau ' + l.n + ' · ' + l.count + (l.count === 1 ? ' opgave' : ' opgaver') + '</div>' +
      '<div class="meter" style="margin:8px 0 4px"><i style="width:' + Math.max(pct, 4) + '%"></i></div>' +
      '<div class="sub">' + (l.next ? l.left + (l.left === 1 ? ' opgave' : ' opgaver') + ' til næste niveau' : 'Du er på det højeste niveau!') + '</div></div></div>';
  }
  function prevNeed(l) { var steps = [0, 3, 10, 25, 50, 100, 200]; return steps[l.n - 1] || 0; }
  function bossCard(b) {
    if (!b) { return ''; }
    var left = Math.max(0, b.hp - b.hits), pct = Math.round(100 * left / b.hp), dead = b.defeated;
    var scale = dead ? 0.6 : 0.7 + 0.5 * pct / 100;
    var face = dead
      ? '<path d="M40 54 L50 62 M50 54 L40 62 M70 54 L80 62 M80 54 L70 62" stroke="#22304A" stroke-width="4" stroke-linecap="round"></path><path d="M46 80 Q60 72 74 80" fill="none" stroke="#22304A" stroke-width="4" stroke-linecap="round"></path>'
      : '<circle cx="46" cy="58" r="7" fill="#FFF"></circle><circle cx="74" cy="58" r="7" fill="#FFF"></circle><circle cx="47" cy="60" r="3.5" fill="#22304A"></circle><circle cx="73" cy="60" r="3.5" fill="#22304A"></circle><path d="M36 46 L54 54 M84 46 L66 54" stroke="#22304A" stroke-width="4" stroke-linecap="round"></path><path d="M44 80 L50 74 L56 80 L62 74 L68 80 L74 74 L78 80" fill="#FFF" stroke="#22304A" stroke-width="2" stroke-linejoin="round"></path>';
    return '<div class="card boss"><div class="row"><b>Ugens boss: ' + esc(b.name) + '</b><span>' + b.hits + ' af ' + b.hp + '</span></div>' +
      '<div class="bossrow"><svg viewBox="0 0 120 120" width="84" height="84" aria-hidden="true"><g transform="translate(60 66) scale(' + scale.toFixed(2) + ') translate(-60 -66)">' +
      '<path d="M30 40 L38 14 L52 34 M90 40 L82 14 L68 34" fill="#6C4AB6"></path><ellipse cx="60" cy="68" rx="38" ry="36" fill="#6C4AB6"></ellipse>' + face + '</g></svg>' +
      '<div class="grow"><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="' + b.hp + '" aria-valuenow="' + b.hits + '"><i style="width:' + pct + '%;background:#C73A30"></i></div>' +
      '<div class="sub" style="margin-top:6px">' + (dead ? 'Bossen er besejret! Godt gået, alle sammen.' : 'Bossen har ' + left + ' liv tilbage. Hver godkendt opgave er et slag.') + '</div></div></div></div>';
  }

  // ---- bytte ----
  function tradeForm(i, s) {
    var maxAmt = Math.min(i.price, s.balance);
    return '<div class="card tradeform"><b>Byt "' + esc(i.title) + '"</b>' +
      '<label for="tr-to">Giv den til</label><select id="tr-to">' + s.siblings.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('') + '</select>' +
      '<label for="tr-amt">Du betaler (0 til ' + maxAmt + ' kr.)</label><input id="tr-amt" type="number" inputmode="numeric" min="0" max="' + maxAmt + '" value="0">' +
      '<div class="row2"><button class="btn" data-tradesend="' + i.id + '">Send tilbud</button><button class="btn ghost" data-tradecancel="1">Annullér</button></div></div>';
  }
  function tradeCards(s) {
    var out = '';
    s.trades_in.forEach(function (t) {
      out += '<div class="card"><b>' + esc(t.from) + ' vil bytte</b><div class="sub" style="margin:4px 0 10px">Tag "' + esc(t.title) + '" (' + t.price + ' kr)' + (t.amount ? ' og få ' + t.amount + ' kr af ' + esc(t.from) : '') + '.</div>' +
        '<div class="row2"><button class="btn" data-tradeyes="' + t.id + '">Tag imod</button><button class="btn ghost" data-tradeno="' + t.id + '">Nej tak</button></div></div>';
    });
    s.trades_out.forEach(function (t) {
      out += '<div class="card"><div class="row"><b>Du har tilbudt "' + esc(t.title) + '"</b></div><div class="sub">Venter på svar fra ' + esc(t.to) + '.</div>' +
        '<button class="btn ghost" style="margin-top:8px" data-tradeno="' + t.id + '">Træk tilbage</button></div>';
    });
    return out;
  }

  // ---- beskeder på telefonen (web-push) ----
  var pushState = 'unknown';   // unknown | ready | on | blocked | ios | none
  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function standalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
  function pushSupported() { return window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function key64(text) {
    var pad = '='.repeat((4 - text.length % 4) % 4), raw = atob((text + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) { out[i] = raw.charCodeAt(i); }
    return out;
  }
  function detectPush() {
    if (!window.isSecureContext) { pushState = 'none'; return Promise.resolve(); }
    if (isIOS() && !standalone()) { pushState = 'ios'; return Promise.resolve(); }
    if (!pushSupported()) { pushState = 'none'; return Promise.resolve(); }
    if (Notification.permission === 'denied') { pushState = 'blocked'; return Promise.resolve(); }
    return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (sub) {
        if (sub && Notification.permission === 'granted') {
          pushState = 'on';
          return call('api/push', true, { subscription: sub.toJSON() }).catch(function () {});   // forny stille
        }
        pushState = 'ready';
      }).catch(function () { pushState = 'none'; });
  }
  function enablePush() {
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') { pushState = 'blocked'; render(); return; }
      return call('api/push_key').then(function (r) {
        return navigator.serviceWorker.ready.then(function (reg) {
          return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key64(r.key) });
        });
      }).then(function (sub) { return call('api/push', true, { subscription: sub.toJSON() }); })
        .then(function () { pushState = 'on'; render(); });
    }).catch(function () { errBox.textContent = 'Kunne ikke slå beskeder til'; errBox.hidden = false; });
  }
  function pushCard() {
    if (pushState === 'ready') {
      return '<div class="card"><b>Få besked på din telefon</b><div class="sub" style="margin:4px 0 10px">Så ved du, når der er en ny opgave.</div>' +
        '<button class="btn" data-pushon="1">Slå beskeder til</button></div>';
    }
    if (pushState === 'ios') {
      return '<div class="card"><b>Få besked på din telefon</b><div class="sub">Tryk på del-knappen i Safari, vælg Føj til hjemmeskærm, og åbn så Pligter derfra.</div></div>';
    }
    if (pushState === 'blocked') {
      return '<div class="card"><b>Beskeder er slået fra</b><div class="sub">Tillad beskeder for denne side i telefonens indstillinger.</div></div>';
    }
    return '';
  }

  function saving(s) { return goalCard(s.saving, ''); }

  // billede: formindskes i telefonen, så det er hurtigt at sende
  var picker = document.getElementById('pick'), pickFor = null;
  function shrink(file, done) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 900 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var q = 0.75, url = c.toDataURL('image/jpeg', q);
        while (url.length > 560000 && q > 0.3) { q -= 0.15; url = c.toDataURL('image/jpeg', q); }
        done(url.split(',')[1]);
      };
      img.onerror = function () { errBox.textContent = 'Billedet kunne ikke læses'; errBox.hidden = false; };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  picker.addEventListener('change', function () {
    var file = picker.files && picker.files[0], id = pickFor;
    picker.value = '';
    if (file && id) { shrink(file, function (b64) { act('api/items/' + id + '/done', { image: b64 }); }); }
  });

  app.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    if (b.dataset.pushon) { enablePush(); }
    if (b.dataset.trade) { tradeOpen = b.dataset.trade; render(); }
    if (b.dataset.tradecancel) { tradeOpen = ''; render(); }
    if (b.dataset.tradesend) {
      var to = document.getElementById('tr-to').value, amt = document.getElementById('tr-amt').value, id = b.dataset.tradesend;
      tradeOpen = '';
      act('api/items/' + id + '/trade', { to: to, amount: amt });
    }
    if (b.dataset.tradeyes) { act('api/trades/' + b.dataset.tradeyes + '/accept'); }
    if (b.dataset.tradeno) { act('api/trades/' + b.dataset.tradeno + '/end'); }
    if (b.dataset.pick) { pickFor = b.dataset.pick; picker.click(); }
    if (b.dataset.done) { act('api/items/' + b.dataset.done + '/done'); }
    if (b.dataset.claim) { act('api/tasks/' + b.dataset.claim + '/claim'); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); } });
  setInterval(function () { if (!tradeOpen) { load(); } }, 15000);
  load().then(detectPush).then(render);
})();
</script>
</body>
</html>
