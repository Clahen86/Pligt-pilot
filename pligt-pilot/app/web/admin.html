  var PRESETS = {
    'Vaskemaskine': { title: 'Flyt tøj fra vaskemaskinen til tørretumbleren', price: '5', words: ['vaskemaskine', 'washing', 'washer'], not: ['opvask', 'dishwasher'] },
    'Tørretumbler': { title: 'Tag tøj ud af tørretumbleren og fold det', price: '8', words: ['tørretumbler', 'tumbler', 'dryer'], not: ['hair', 'hår'] },
    'Opvaskemaskine': { title: 'Tøm opvaskemaskinen', price: '5', words: ['opvask', 'dishwasher'], not: [] },
    'Andet': { title: '', price: '5', words: [], not: [] }
  };
  function candidates(preset) {
    var p = PRESETS[preset] || PRESETS.Andet, okDomain = /^(sensor|switch|binary_sensor|input_boolean|select)\./;
    var all = entityList.filter(function (e) { return okDomain.test(e[0]); });
    var hit = all.filter(function (e) {
      var t = (e[0] + ' ' + e[1]).toLowerCase();
      return p.words.some(function (w) { return t.indexOf(w) >= 0; }) && !p.not.some(function (w) { return t.indexOf(w) >= 0; });
    });
    return (hit.length ? hit : all).slice(0, 300);
  }
  function doorCandidates(preset) {
    var words = (PRESETS[preset] || PRESETS.Andet).words;
    var all = entityList.filter(function (e) { return e[0].indexOf('binary_sensor.') === 0; });
    function text(e) { return (e[0] + ' ' + e[1]).toLowerCase(); }
    var doors = all.filter(function (e) {
      return ['door', 'opening', 'window', 'garage_door'].indexOf(e[2]) >= 0 || /dør|dor_|door|låge|lage|kontakt|contact|luge/.test(text(e));
    });
    function like(e) { return words.some(function (w) { return text(e).indexOf(w) >= 0; }) ? 1 : 0; }
    doors.sort(function (a, b) { return like(b) - like(a); });
    return (doors.length ? doors : all).slice(0, 200);
  }
  function doorList(id, preset) {
    return '<datalist id="' + id + '">' + doorCandidates(preset).map(function (e) { return '<option value="' + esc(e[0]) + '">' + esc(e[1]) + '</option>'; }).join('') + '</datalist>';

      } else { pinput.select(); pinput.setSelectionRange(0, 9999); say('Tryk og hold for at kopiere'); }
    }
    else if (d.newparent) { if (confirm('Det gamle link holder op med at virke. Fortsæt?')) { post('api/parents/' + d.newparent + '/newlink', {}, 'Nyt link er lavet'); } }
    else if (d.delparent) { if (confirm('Fjerne denne forælder? Linket holder op med at virke.')) { post('api/parents/' + d.delparent + '/delete', {}, 'Forælderen er fjernet'); } }
    else if (d.pickicon !== undefined) {
      var hid = document.getElementById(d.for);
      hid.value = d.pickicon;
      Array.prototype.forEach.call(hid.parentNode.querySelectorAll('.ic'), function (el) { el.classList.toggle('on', el === b); });
      if (hid.dataset.draft) { setDraft(hid.dataset.draft, hid.value); }
    }
    else if (d.qr) { qrKid = qrKid === d.qr ? '' : d.qr; render(); }
    else if (d.copy) {
      var k = kidById(d.copy), input = document.getElementById('l-' + d.copy);
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(linkFor(k)).then(function () { say('Linket er kopieret'); }, function () { input.select(); });
      } else { input.select(); input.setSelectionRange(0, 9999); say('Tryk og hold for at kopiere'); }
    }
    else if (d.newlink) { if (confirm('Det gamle link holder op med at virke. Fortsæt?')) { post('api/kids/' + d.newlink + '/newlink', {}, 'Nyt link er lavet'); } }
    else if (d.delkid) { if (confirm('Fjerne barnet og alle dets opgaver og penge?')) { post('api/kids/' + d.delkid + '/delete', {}, 'Barnet er fjernet'); } }
    else if (d.savesettings) {
      var body = {
        goal: document.getElementById('s-goal').value, hero_bonus: document.getElementById('s-bonus').value,
        perfect_bonus: document.getElementById('s-perfect').value, penalty: document.getElementById('s-penalty').value,
        reminder_time: document.getElementById('s-remind').value, celebrate_light: document.getElementById('s-light').value,
        lang: document.getElementById('s-lang').value, streak_bonus: document.getElementById('s-streak').value, boss_hp: document.getElementById('s-bosshp').value, boss_bonus: document.getElementById('s-bossbonus').value,
        trading: document.getElementById('s-trading').checked,
        min_tasks_age: document.getElementById('s-minage').value, min_tasks_week: document.getElementById('s-minweek').value,
        meal_price: document.getElementById('s-meal').value,
          weekly_summary: document.getElementById('s-summary').checked
      };
      var ft = document.getElementById('s-ft').value, fa = document.getElementById('s-fa').value, fam = state.family;
      if (!fam ? (ft || fa) : (ft !== fam.title || String(fa) !== String(fam.amount))) { body.family_title = ft; body.family_amount = fa; }
      post('api/settings', body, 'Gemt');
    }
  });
  setInterval(function () { if (!document.hidden && !typing()) { load(); } }, 20000);
  // langt tryk (ca. 600 ms) på en hurtigknap, med mus, pen eller finger
  function pressEnd() { clearTimeout(pressTimer); pressTimer = null; pressAt = null; }
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('button[data-quick]');
    pressed = false; pressEnd();
    if (!b || (e.pointerType === 'mouse' && e.button !== 0)) { return; }
    pressAt = { x: e.clientX, y: e.clientY };
    pressTimer = setTimeout(function () { pressTimer = null; pressed = true; unpin(b.dataset.quick); }, 600);
  });
  document.addEventListener('pointermove', function (e) {
    if (pressAt && Math.abs(e.clientX - pressAt.x) + Math.abs(e.clientY - pressAt.y) > 12) { pressEnd(); }
  });
  ['pointerup', 'pointercancel'].forEach(function (n) { document.addEventListener(n, pressEnd); });
  document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('button[data-quick]')) { e.preventDefault(); } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !typing()) { load(); } });
  load();
})();
</script>
