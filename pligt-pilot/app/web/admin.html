<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pligter</title>
<style>
:root { --accent: #0B7A70; --ink: #22304A; --muted: #55627A; --cream: #FFF6E9; --sun: #FFC247; --red: #C73A30; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--cream); color: var(--ink);
  font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; -webkit-text-size-adjust: 100%;
}
main { max-width: 520px; margin: 0 auto; padding: 20px 20px 110px; display: flex; flex-direction: column; gap: 14px; }
button, input, select { font: inherit; }
button { cursor: pointer; }
h1 { font-size: 24px; font-weight: 900; line-height: 1.1; margin: 0; }
h2 { font-size: 17px; font-weight: 900; margin: 10px 0 0; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
.sub { font-size: 14px; font-weight: 700; color: var(--muted); }
.head { display: flex; align-items: center; justify-content: space-between; }
.badge { background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800; }
.count { background: var(--red); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 900; }
.list { display: flex; flex-direction: column; gap: 8px; }
.card { background: #fff; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.card { flex-direction: row; padding: 8px 8px 8px 12px; border-radius: 20px; }
.grow { flex: 1; min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; color: #fff; font-size: 17px; font-weight: 900;
  display: flex; align-items: center; justify-content: center; flex: none; }
.avatar.big { width: 44px; height: 44px; font-size: 20px; }
.t b { display: block; font-size: 15px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.t span { font-size: 13px; color: var(--muted); font-weight: 700; }
.icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 0; flex: none; }
.icon.no { border: 2px solid var(--red); background: #fff; }
.icon.yes { border: 0; background: var(--accent); }
.btn { border: 0; background: var(--accent); color: #fff; font-size: 15px; font-weight: 800; min-height: 44px; padding: 0 16px; border-radius: 14px; }
.btn.ghost { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
.btn.sun { background: var(--sun); color: var(--ink); }
.btn.danger { background: #fff; color: var(--red); border: 2px solid var(--red); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 14px; }
.kid-top { display: flex; align-items: center; gap: 12px; }
.kid-top .name { font-size: 18px; font-weight: 900; line-height: 1.1; }
.money { text-align: right; }
.money b { display: block; font-size: 28px; font-weight: 900; line-height: 1; }
.money span { font-size: 12px; font-weight: 700; color: var(--muted); }
.mini { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
.mini i { display: block; width: 18px; border-radius: 5px; }
.between { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero { display: inline-flex; align-items: center; gap: 6px; background: var(--sun); border-radius: 999px; padding: 6px 12px 6px 9px; font-size: 13px; font-weight: 900; }
.total { display: flex; justify-content: space-between; align-items: center; background: var(--ink); color: #fff; border-radius: 22px; padding: 14px 18px; }
.total small { display: block; font-size: 13px; font-weight: 700; color: #C9D2E3; }
.total b { font-size: 26px; font-weight: 900; }
.empty { background: #fff; border-radius: 20px; padding: 18px 16px; font-size: 15px; font-weight: 700; color: var(--muted); }
.note { font-size: 13px; font-weight: 700; color: var(--muted); }
.group { font-size: 14px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 6px 0 -2px; }
.price { font-size: 15px; font-weight: 900; color: var(--accent); white-space: nowrap; }
.sw { width: 56px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; flex: none; }
.sw span { display: block; position: relative; width: 52px; height: 30px; border-radius: 999px; background: #B9B2A4; transition: background .15s; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw[aria-checked="true"] span { background: var(--accent); }
.sw[aria-checked="true"] span::after { left: 25px; }
label { font-size: 13px; font-weight: 800; color: var(--muted); display: block; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=date], input[type=time], select { width: 100%; height: 44px; border-radius: 12px; border: 2px solid #D9CFBE; padding: 0 12px; font-size: 16px; font-weight: 700; color: var(--ink); background: #fff; }
.dates { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 6px; }
.qr { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 10px; }
.qrsvg { border-radius: 14px; border: 2px solid #D9CFBE; max-width: 100%; height: auto; }
.col { display: flex; flex-direction: column; gap: 6px; }
.linkbtn { display: flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 8px; }
.ico { flex: none; width: 40px; height: 40px; border-radius: 12px; background: #FFF1CF; display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
.icons { display: flex; flex-wrap: wrap; gap: 6px; }
.ic { min-width: 42px; height: 42px; border-radius: 12px; border: 2px solid #D9CFBE; background: #fff; font-size: 22px; padding: 0 6px; }
.ic.auto { font-size: 14px; font-weight: 800; color: var(--ink); }
.ic.on { border-color: var(--accent); background: #E1F2EF; }
.two { display: flex; gap: 10px; }
.two > div { flex: 1; min-width: 0; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: var(--ink); margin: 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.linkbox { display: flex; gap: 8px; }
.linkbox input { font-size: 14px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
.steps .step { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 18px; padding: 10px 12px; }
.steps .n { width: 30px; height: 30px; border-radius: 50%; background: var(--sun); font-weight: 900; display: flex; align-items: center; justify-content: center; flex: none; }
nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #EADFCB; display: flex; justify-content: center; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); z-index: 5; }
nav .in { display: flex; gap: 6px; width: 100%; max-width: 520px; }
nav button { flex: 1; min-height: 48px; border: 0; background: transparent; border-radius: 14px; font-size: 14px; font-weight: 800; color: var(--muted); position: relative; }
nav button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 14%, #fff); color: var(--accent); }
nav .dot { position: absolute; top: 4px; right: 18%; background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; min-width: 18px; padding: 1px 5px; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 700; z-index: 9; max-width: 90vw; }
.toast[hidden] { display: none; }
.meter { height: 14px; border-radius: 999px; background: #E8DFD0; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--accent); min-width: 6px; }
.shot { width: 100%; max-height: 260px; object-fit: contain; border-radius: 14px; background: #EFE7D8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: #F1E8D6; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; color: var(--ink); }
nav button { font-size: 13px; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Menu"><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" hidden role="status"></div>
<script>
(function () {
  var state = null, found = null, powerList = [], entityList = [], entitiesOn = null, editKids = [], sugEdit = -1, taskEdit = '', tab = 'home', suggestions = null, sugOn = {};
  var qrKid = '', qrParent = '';
  var draft = { rule: { preset: 'Vaskemaskine', entity: '', title: 'Flyt tøj fra vaskemaskinen til tørretumbleren', price: '5' }, task: { title: '', price: '5', room: '', repeat: 'daily', open: false, times: '1', kids: [], photo: false, season: '', surprise: false, icon: '' }, kid: { name: '', age: '', birthday: '' }, reward: { title: '', price: '10' } };
  var app = document.getElementById('app'), nav = document.getElementById('nav'), toast = document.getElementById('toast');
  // ---- sprog: udskifter kendte danske tekststykker (samme metode som serverens i18n.py) ----
  var I18N = { lang: 'da', locale: 'da-DK', rx: null, map: {}, exact: {}, loading: false };
  var W = 'A-Za-z0-9_ÆØÅæøå';
  function i18nSetup(data) {
    var map = {}, exact = {}, keys = [], k;
    for (k in data.table) {
      if (k.charAt(0) === '=') { exact[k.slice(1)] = data.table[k]; } else { map[k] = data.table[k]; keys.push(k); }
    }
    keys.sort(function (a, b) { return b.length - a.length; });
    var word = new RegExp('^[' + W + ']'), wordEnd = new RegExp('[' + W + ']$'), A = [], B = [];
    keys.forEach(function (key) {
      var piece = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + (wordEnd.test(key) ? '(?![' + W + '])' : '');
      (word.test(key) ? A : B).push(piece);
    });
    var src = [];
    if (A.length) { src.push('(^|[^' + W + '])(' + A.join('|') + ')'); }
    if (B.length) { src.push('(' + B.join('|') + ')'); }
    I18N.rx = src.length ? new RegExp(src.join('|'), 'g') : null;
    I18N.map = map; I18N.exact = exact; I18N.lang = data.lang; I18N.locale = data.locale || 'da-DK';
    document.documentElement.lang = data.lang === 'nb' ? 'nb' : data.lang;
    document.title = T(document.title);
  }
  function T(s) {
    if (!s || !I18N.rx) { return s; }
    var core = String(s).trim();
    if (I18N.exact[core]) { return String(s).replace(core, I18N.exact[core]); }
    return String(s).replace(I18N.rx, function (m, pre, a, b) {
      return a !== undefined ? pre + I18N.map[a] : I18N.map[m];
    });
  }
  function i18nApply(root) {
    if (!I18N.rx) { return; }
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), node, list = [];
    while ((node = walker.nextNode())) { list.push(node); }
    list.forEach(function (t) {
      var p = t.parentNode ? t.parentNode.nodeName : '';
      if (p === 'SCRIPT' || p === 'STYLE' || p === 'TEXTAREA' || t.__i === t.nodeValue) { return; }
      var v = T(t.nodeValue);
      if (v !== t.nodeValue) { t.nodeValue = v; }
      t.__i = t.nodeValue;
    });
    Array.prototype.forEach.call(root.querySelectorAll('[placeholder],[aria-label],[title],[alt]'), function (el) {
      ['placeholder', 'aria-label', 'title', 'alt'].forEach(function (a) {
        var v = el.getAttribute(a);
        if (v && el.__ia !== v + a) { var t = T(v); if (t !== v) { el.setAttribute(a, t); } el.__ia = t + a; }
      });
    });
  }
  var nativeConfirm = window.confirm;
  window.confirm = function (m) { return nativeConfirm.call(window, T(m)); };
  function loadLang() {
    if (I18N.loading) { return; }
    I18N.loading = true;
    fetch('api/i18n').then(function (r) { return r.json(); }).then(function (d) { i18nSetup(d); }).catch(function () {})
      .then(function () { I18N.loading = false; render(); });
  }
  // Forældreside med eget link (/p/...): kan lægges på hjemmeskærmen som en app
  if (/^\/p\/[^/]+\//.test(location.pathname)) {
    ['manifest', 'apple-touch-icon'].forEach(function (rel) {
      var l = document.createElement('link'); l.rel = rel; l.href = rel === 'manifest' ? 'manifest.json' : 'icon.png'; document.head.appendChild(l);
    });
    if ('serviceWorker' in navigator && window.isSecureContext) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  }
  var REPEAT = { daily: 'Hver dag', weekly: 'Hver uge', once: 'Én gang' };
  var CHECK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4L19 7"></path></svg>';
  var CROSS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C73A30" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
  var CROWN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#22304A" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"></path></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function say(msg) {
    toast.textContent = T(msg); toast.hidden = false;
    clearTimeout(say.t); say.t = setTimeout(function () { toast.hidden = true; }, 3200);
  }
  function call(path, body) {
    var opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    return fetch(path, opt).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error || 'Fejl'); } return j; });
    });
  }
  function post(path, body, okMsg) {
    return call(path, body || {}).then(function (s) {
      if (state) { ['public_url', 'notify_on', 'local_url', 'kid_https', 'push_on', 'via_link', 'parent_name'].forEach(function (key) { s[key] = state[key]; }); }
      state = s; render(); if (okMsg) { say(okMsg); } return s;
    }).catch(function (e) { say(e.message); throw e; });
  }
  function load() {
    return call('api/state').then(function (s) { state = s; render(); })
      .catch(function () { say('Kan ikke hente data. Prøver igen…'); });
  }
  function typing() {
    var a = document.activeElement;
    return a && (a.tagName === 'INPUT' || a.tagName === 'SELECT');
  }
  var SEASON = { '': 'Hele året', 'forår': 'Forår (mar–maj)', 'sommer': 'Sommer (jun–aug)', 'efterår': 'Efterår (sep–nov)', 'vinter': 'Vinter (dec–feb)' };
  var SEASON_SHORT = { 'forår': 'om foråret', 'sommer': 'om sommeren', 'efterår': 'om efteråret', 'vinter': 'om vinteren' };
  function seasonSelect(id, val, attr) {
    return '<select id="' + id + '"' + (attr || '') + '>' + Object.keys(SEASON).map(function (k) {
      return '<option value="' + k + '"' + ((val || '') === k ? ' selected' : '') + '>' + SEASON[k] + '</option>';
    }).join('') + '</select>';
  }
  // dag/måned/år som tre valgmuligheder: hurtigere end en kalender, når året ligger langt tilbage
  var MONTHS = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
  function dateSelects(id, value, draftKey) {
    var p = String(value || '').split('-'), y = p[0] || '', m = p[1] || '', d = p[2] || '', now = new Date().getFullYear();
    function opts(list, cur, label) {
      return '<option value="">' + label + '</option>' + list.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('');
    }
    var days = [], mons = [], years = [], i;
    for (i = 1; i <= 31; i++) { days.push([('0' + i).slice(-2), String(i)]); }
    for (i = 0; i < 12; i++) { mons.push([('0' + (i + 1)).slice(-2), MONTHS[i]]); }
    for (i = now; i >= now - 25; i--) { years.push([String(i), String(i)]); }
    var at = ' data-bd="' + id + '"' + (draftKey ? ' data-bdraft="' + draftKey + '"' : '');
    return '<div class="dates"><select id="' + id + '-d"' + at + ' aria-label="Dag">' + opts(days, d, 'Dag') + '</select>' +
      '<select id="' + id + '-m"' + at + ' aria-label="Måned">' + opts(mons, m, 'Måned') + '</select>' +
      '<select id="' + id + '-y"' + at + ' aria-label="År">' + opts(years, y, 'År') + '</select></div>';
  }
  function readDate(id) {
    var v = ['y', 'm', 'd'].map(function (c) { return document.getElementById(id + '-' + c).value; });
    return v[0] && v[1] && v[2] ? v.join('-') : (v[0] || v[1] || v[2] ? v.join('-') : '');
  }
  function validDate(v) { return /^\d{4}-\d\d-\d\d$/.test(v) ? v : ''; }

  // billede til opgaven: tryk på et ikon, eller vælg Automatisk
  function iconPicker(id, value, draftKey) {
    var out = '<div class="icons" role="group" aria-label="Billede"><input type="hidden" id="' + id + '" value="' + esc(value || '') + '"' + (draftKey ? ' data-draft="' + draftKey + '"' : '') + '>' +
      '<button type="button" class="ic auto' + (value ? '' : ' on') + '" data-pickicon="" data-for="' + id + '">Automatisk</button>';
    state.icons.forEach(function (ic) {
      out += '<button type="button" class="ic' + (value === ic ? ' on' : '') + '" data-pickicon="' + ic + '" data-for="' + id + '" aria-label="' + ic + '">' + ic + '</button>';
    });
    return out + '</div>';
  }
  function timesSelect(id, val) {
    return '<select id="' + id + '">' + [1, 2, 3, 4, 5].map(function (n) {
      return '<option value="' + n + '"' + (+val === n ? ' selected' : '') + '>' + (n === 1 ? '1 gang' : n + ' gange') + '</option>';
    }).join('') + '</select>';
  }
  function kidBoxes(group, chosen) {
    if (state.kids.length < 2) { return ''; }
    return '<div><label>Hvem skal have den?</label>' +
      '<div class="note" style="margin-bottom:6px">' + (chosen.length ? 'Kun de valgte børn' : 'Alle børn (vælg for at begrænse)') + '</div>' +
      state.kids.map(function (k) {
        return '<label class="check" style="margin:0 0 6px"><input type="checkbox" data-kidbox="' + group + '" value="' + k.id + '"' +
          (chosen.indexOf(k.id) >= 0 ? ' checked' : '') + '> ' + esc(k.name) + '</label>';
      }).join('') + '</div>';
  }
  function editForm(key, r, withKids) {
    return '<div class="two"><div><label for="' + key + '-t">Navn</label><input id="' + key + '-t" type="text" value="' + esc(r.title) + '"></div>' +
      '<div><label for="' + key + '-p">Pris (kr.)</label><input id="' + key + '-p" type="number" inputmode="numeric" min="0" max="1000" value="' + esc(r.price) + '"></div></div>' +
      '<div class="two"><div><label for="' + key + '-a">Fra alder</label><input id="' + key + '-a" type="number" inputmode="numeric" min="0" max="25" value="' + esc(r.age_min || 0) + '"></div>' +
      '<div><label for="' + key + '-r">Hvor tit</label><select id="' + key + '-r">' +
      ['daily', 'weekly', 'once'].map(function (x) { return '<option value="' + x + '"' + (r.repeat === x ? ' selected' : '') + '>' + REPEAT[x] + '</option>'; }).join('') + '</select></div></div>' +
      '<div><label for="' + key + '-n">Hvor mange gange pr. periode</label>' + timesSelect(key + '-n', r.times || 1) + '</div>' +
      (withKids ? '<div><label>Billede</label>' + iconPicker(key + '-ic', r.icon, '') + '</div>' : '') +
      (withKids ? '<div><label for="' + key + '-se">Hvornår på året</label>' + seasonSelect(key + '-se', r.season) + '</div>' +
        '<label class="check"><input type="checkbox" id="' + key + '-su"' + (r.surprise ? ' checked' : '') + '> Overraskelse: dukker af og til op med dobbelt pris</label>' : '') +
      (withKids ? kidBoxes('edit', editKids) + '<label class="check"><input type="checkbox" id="' + key + '-ph"' + (r.photo ? ' checked' : '') + '> Barnet skal tage et billede som bevis</label>' : '') +
      '<div class="row"><button class="btn small" data-save="' + key + '">Gem</button><button class="btn small ghost" data-cancel="1">Annullér</button></div>';
  }
  function readForm(key) {
    var f = { title: document.getElementById(key + '-t').value, price: document.getElementById(key + '-p').value,
      age_min: document.getElementById(key + '-a').value, repeat: document.getElementById(key + '-r').value,
      times: document.getElementById(key + '-n').value };
    if (key.charAt(0) === 't') { f.icon = document.getElementById(key + '-ic').value; f.kids = editKids.slice(); f.photo = document.getElementById(key + '-ph').checked; f.season = document.getElementById(key + '-se').value; f.surprise = document.getElementById(key + '-su').checked; }
    return f;
  }
  function kidTask(id) { return state.tasks.filter(function (t) { return t.id === id; })[0] || {}; }
  function goalBox(k) {
    var g = k.saving, out = '<div><label>Sparemål</label>';
    if (g) {
      out += '<div class="note" style="margin-bottom:6px">' + esc(g.title) + ': ' + g.saved + ' af ' + g.amount + ' kr' + (g.reached ? ' – nået!' : '') + '</div>';
    }
    out += '<div class="two"><div><input id="g-t-' + k.id + '" type="text" aria-label="Hvad sparer ' + esc(k.name) + ' op til?" placeholder="Fx Cykel" value="' + (g ? esc(g.title) : '') + '"></div>' +

      '<div class="note">' + (entitiesOn === false ? 'Appen kan ikke se Home Assistant lige nu. Skriv enhedens id selv.' : 'Vælg fra listen, eller skriv selv. Bedst er en stikkontakt med effektmåling (watt).') + '</div>' +
      '<div class="two"><div><label for="r-title">Opgave</label><input id="r-title" type="text" data-draft="rule.title" value="' + esc(d.title) + '"></div>' +
      '<div><label for="r-price">Pris (kr.)</label><input id="r-price" type="number" inputmode="numeric" min="0" max="1000" data-draft="rule.price" value="' + esc(d.price) + '"></div></div>' +
      '<button class="btn" data-addrule="1">Tilføj regel</button></div>';
    return out;
  }

  var fairTimer = null;
  function updateFair() {
    var el = document.getElementById('fair');
    if (!el) { return; }
    var d = draft.task;
    call('api/fairness?price=' + encodeURIComponent(d.price) + '&repeat=' + encodeURIComponent(d.repeat) + '&times=' + encodeURIComponent(d.times)).then(function (r) {
      el = document.getElementById('fair');
      if (!el) { return; }
      el.textContent = r.text || '';
      el.style.color = r.level === 'high' ? '#C73A30' : r.level === 'low' ? '#B05A00' : '#0B7A70';
    }).catch(function () {});
  }
  function loadFound() {
    return call('api/house_find').then(function (r) { found = r.found || []; powerList = r.power || []; entitiesOn = !!r.on; render(); })
      .catch(function () { found = []; });
  }
  function loadEntities() {
    return call('api/entities').then(function (r) { entityList = r.entities || []; entitiesOn = !!r.on && entityList.length > 0; render(); })
      .catch(function () { entitiesOn = false; });
  }

  function render() {
    if (state && state.lang && state.lang !== I18N.lang) { loadLang(); if (!I18N.rx) { return; } }
    if (!state) { return; }
    app.innerHTML = tab === 'home' ? home() : tab === 'tasks' ? tasks() : tab === 'house' ? house() : kids();
    if (tab === 'tasks') { updateFair(); }
    var pend = state.pending.length;
    nav.innerHTML =
      '<button data-tab="home"' + (tab === 'home' ? ' aria-current="page"' : '') + '>Oversigt' + (pend ? '<span class="dot">' + pend + '</span>' : '') + '</button>' +
      '<button data-tab="tasks"' + (tab === 'tasks' ? ' aria-current="page"' : '') + '>Opgaver</button>' +
      '<button data-tab="house"' + (tab === 'house' ? ' aria-current="page"' : '') + '>Huset</button>' +
      '<button data-tab="kids"' + (tab === 'kids' ? ' aria-current="page"' : '') + '>Børn</button>';
    i18nApply(document.body);
  }

  // ---- hændelser ----------------------------------------------------
  function setDraft(path, value) {
    var p = path.split('.'); draft[p[0]][p[1]] = value;
  }
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.draft) {
      setDraft(t.dataset.draft, t.type === 'checkbox' ? t.checked : t.value);
      if (/^task\.(price|repeat|times)$/.test(t.dataset.draft)) { clearTimeout(fairTimer); fairTimer = setTimeout(updateFair, 300); }
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.bd) {
      if (t.dataset.bdraft) { setDraft(t.dataset.bdraft, readDate(t.dataset.bd)); }
      return;
    }
    if (t.dataset && t.dataset.kidbox) {
      var list = t.dataset.kidbox === 'draft' ? draft.task.kids : editKids, at = list.indexOf(t.value);
      if (t.checked && at < 0) { list.push(t.value); } else if (!t.checked && at >= 0) { list.splice(at, 1); }
      return;
    }
    if (t.dataset && t.dataset.draft) {
      setDraft(t.dataset.draft, t.type === 'checkbox' ? t.checked : t.value);
      if (t.dataset.draft === 'rule.preset') { var pr = PRESETS[t.value]; draft.rule.title = pr.title; draft.rule.price = pr.price; draft.rule.entity = ''; render(); }
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    var d = b.dataset;
    if (d.tab) { tab = d.tab; render(); window.scrollTo(0, 0); if ((d.tab === 'house' || d.tab === 'kids') && entitiesOn === null) { loadEntities(); }
      if (d.tab === 'house') { loadFound(); } }
    else if (d.claimyes) { post('api/claims/' + d.claimyes + '/approve', {}, 'Godkendt'); }
    else if (d.claimno) { post('api/claims/' + d.claimno + '/reject', {}, 'Afvist'); }
    else if (d.wishyes) { post('api/kids/' + d.wishyes + '/wish/accept', {}, 'Sat som sparemål'); }
    else if (d.wishno) { post('api/kids/' + d.wishno + '/wish/reject', {}, 'Ønsket er fjernet'); }
    else if (d.payall) { if (confirm('Udbetale til alle børn?')) { post('api/pay_all', {}, 'Udbetalt'); } }
    else if (d.rewardex) { post('api/rewards/examples', {}, 'Eksempler tilføjet'); }
    else if (d.delreward) { post('api/rewards/' + d.delreward + '/delete', {}, 'Slettet'); }
    else if (d.addreward) {
      post('api/rewards', { title: draft.reward.title, price: draft.reward.price }, 'Belønningen er tilføjet')
        .then(function () { draft.reward = { title: '', price: '10' }; render(); }).catch(function () {});
    }
    else if (d.starter) { post('api/starter', {}, 'Startpakken er oprettet. Slå det fra, du ikke vil have.'); }
    else if (d.approveall) { post('api/approve_all', {}, 'Alt er godkendt'); }
    else if (d.approve) { post('api/items/' + d.approve + '/approve', {}, 'Godkendt'); }
    else if (d.reject) { post('api/items/' + d.reject + '/reject', {}, 'Afvist. Barnet kan prøve igen.'); }
    else if (d.payout) { post('api/kids/' + d.payout + '/payout', {}, 'Udbetalt'); }
    else if (d.bonus) { post('api/hero_bonus', {}, 'Bonus givet'); }
    else if (d.suggest) {
      call('api/suggestions').then(function (r) {
        suggestions = r.rows; sugOn = {};
        suggestions.forEach(function (row, i) { sugOn[i] = false; });
        render();
      }).catch(function (err) { say(err.message); });
    }
    else if (d.sugedit) { sugEdit = +d.sugedit; render(); }
    else if (d.taskedit) { taskEdit = d.taskedit; editKids = (kidTask(d.taskedit).kids || []).slice(); render(); }
    else if (d.cancel) { sugEdit = -1; taskEdit = ''; render(); }
    else if (d.sugall) { suggestions.forEach(function (r, i) { sugOn[i] = d.sugall === '1' && !r.exists; }); render(); }
    else if (d.save) {
      var f = readForm(d.save);
      if (d.save.charAt(0) === 's') {
        var row = suggestions[+d.save.slice(1)];
        row.title = f.title; row.price = f.price; row.age_min = f.age_min; row.repeat = f.repeat; row.times = f.times;
        sugEdit = -1; render();
      } else {
        post('api/tasks/' + d.save.slice(1), f, 'Gemt').then(function () { taskEdit = ''; render(); }).catch(function () {});
      }
    }
    else if (d.sug !== undefined) { sugOn[d.sug] = !sugOn[d.sug]; render(); }
    else if (d.setup) {
      var rows = suggestions.filter(function (r, i) { return sugOn[i] && !r.exists; });
      post('api/setup', { rows: rows }, rows.length + ' opgaver oprettet').then(function () { suggestions = null; });
    }
    else if (d.active) {
      var t = state.tasks.filter(function (x) { return x.id === d.active; })[0];
      post('api/tasks/' + d.active, { active: !t.active });
    }
    else if (d.duptask) { post('api/tasks/' + d.duptask + '/duplicate', {}, 'Kopi lavet. Tryk Rediger for at ændre den.'); }
    else if (d.deltask) { if (confirm('Slette opgaven?')) { post('api/tasks/' + d.deltask + '/delete', {}, 'Slettet'); } }
    else if (d.addtask) {
      var x = draft.task;
      post('api/tasks', { title: x.title, price: x.price, room: x.room, repeat: x.repeat, open: x.open, times: x.times, kids: x.kids, photo: x.photo, season: x.season, surprise: x.surprise, icon: x.icon }, 'Opgaven er tilføjet')
        .then(function () { draft.task = { title: '', price: x.price, room: x.room, repeat: x.repeat, open: false, times: '1', kids: [], photo: false, season: '', surprise: false, icon: '' }; render(); }).catch(function () {});
    }
    else if (d.addkid) {
      var y = draft.kid;
      post('api/kids', { name: y.name, age: y.age, birthday: validDate(y.birthday) }, 'Barnet er tilføjet')
        .then(function () { draft.kid = { name: '', age: '', birthday: '' }; render(); }).catch(function () {});
    }
    else if (d.userule) {
      var f = found[+d.userule], pick = +d.alt < 0 ? f.best : f.alts[+d.alt];
      post('api/rules', { name: f.preset, entity: pick.entity, title: f.title, price: f.price }, f.preset + ' er sat op')
        .then(loadFound).catch(function () {});
    }
    else if (d.usepower) {
      var pw = powerList[+d.usepower], pn = document.getElementById('pw-' + d.usepower).value, pp = PRESETS[pn];
      post('api/rules', { name: pn, entity: pw.entity, title: pp.title || ('Opgave efter ' + pw.name), price: pp.price }, pn + ' er sat op')
        .then(loadFound).catch(function () {});
    }
    else if (d.boss) { post('api/boss_bonus', {}, 'Bonus givet'); }
    else if (d.perfect) { post('api/perfect/' + d.perfect, {}, 'Bonus givet'); }
    else if (d.ruleactive) {
      var rl = state.rules.filter(function (x) { return x.id === d.ruleactive; })[0];
      post('api/rules/' + d.ruleactive, { active: !rl.active });
    }
    else if (d.delrule) { if (confirm('Slette reglen?')) { post('api/rules/' + d.delrule + '/delete', {}, 'Reglen er slettet'); } }
    else if (d.addrule) {
      var r = draft.rule;
      post('api/rules', { name: r.preset, entity: r.entity, title: r.title, price: r.price }, 'Reglen er tilføjet')
        .then(function () { draft.rule.entity = ''; render(); }).catch(function () {});
    }
    else if (d.savekid) {
      post('api/kids/' + d.savekid, {
        birthday: validDate(readDate('b-' + d.savekid)),
        lang: document.getElementById('lg-' + d.savekid).value,
        notify: document.getElementById('n-' + d.savekid).value,
        allowance: document.getElementById('al-' + d.savekid).value
      }, 'Gemt');
    }
    else if (d.ntfy) {
      var nk = kidById(d.ntfy);
      post('api/kids/' + d.ntfy, { ntfy_on: !nk.ntfy_on }, nk.ntfy_on ? 'Beskeder er slået fra' : 'Beskeder er slået til');
    }
    else if (d.testntfy) { post('api/kids/' + d.testntfy + '/test', {}, 'Prøvebesked er sendt'); }
    else if (d.pause) {
      var pk = kidById(d.pause);
      post('api/kids/' + d.pause, { paused: !pk.paused }, pk.paused ? pk.name + ' er med igen' : pk.name + ' er sat på pause');
    }
    else if (d.savegoal) {
      post('api/kids/' + d.savegoal + '/goal', { title: document.getElementById('g-t-' + d.savegoal).value, amount: document.getElementById('g-a-' + d.savegoal).value }, 'Sparemål gemt');
    }
    else if (d.cleargoal) { post('api/kids/' + d.cleargoal + '/goal', { title: '', amount: '' }, 'Sparemål fjernet'); }
    else if (d.undo) { if (confirm('Fortryd godkendelsen? Pengene trækkes tilbage.')) { post('api/items/' + d.undo + '/undo', {}, 'Fortrudt. Opgaven venter igen.'); } }
    else if (d.addparent) {
      post('api/parents', { name: document.getElementById('pa-name').value }, 'Forælderen er tilføjet').catch(function () {});
    }
    else if (d.qrparent) { qrParent = qrParent === d.qrparent ? '' : d.qrparent; render(); }
    else if (d.copyparent) {
      var pinput = document.getElementById('pl-' + d.copyparent);
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(pinput.value).then(function () { say('Linket er kopieret'); }, function () { pinput.select(); });
      } else { pinput.select(); pinput.setSelectionRange(0, 9999); say('Tryk og hold for at kopiere'); }
    }
    else if (d.newparent) { if (confirm('Det gamle link holder op med at virke. Fortsæt?')) { post('api/parents/' + d.newparent + '/newlink', {}, 'Nyt link er lavet'); } }
    else if (d.delparent) { if (confirm('Fjerne denne forælder? Linket holder op med at virke.')) { post('api/parents/' + d.delparent + '/delete', {}, 'Forælderen er fjernet'); } }
    else if (d.pickicon !== undefined) {
      var hid = document.getElementById(d.for);
      hid.value = d.pickicon;
      Array.prototype.forEach.call(hid.parentNode.querySelectorAll('.ic'), function (el) { el.classList.toggle('on', el === b); });
      if (hid.dataset.draft) { setDraft(hid.dataset.draft, hid.value); }
    }
    else if (d.qr) { qrKid = qrKid === d.qr ? '' : d.qr; render(); }
    else if (d.copy) {
      var k = kidById(d.copy), input = document.getElementById('l-' + d.copy);
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(linkFor(k)).then(function () { say('Linket er kopieret'); }, function () { input.select(); });
      } else { input.select(); input.setSelectionRange(0, 9999); say('Tryk og hold for at kopiere'); }
    }
    else if (d.newlink) { if (confirm('Det gamle link holder op med at virke. Fortsæt?')) { post('api/kids/' + d.newlink + '/newlink', {}, 'Nyt link er lavet'); } }
    else if (d.delkid) { if (confirm('Fjerne barnet og alle dets opgaver og penge?')) { post('api/kids/' + d.delkid + '/delete', {}, 'Barnet er fjernet'); } }
    else if (d.savesettings) {
      var body = {
        goal: document.getElementById('s-goal').value, hero_bonus: document.getElementById('s-bonus').value,
        perfect_bonus: document.getElementById('s-perfect').value, penalty: document.getElementById('s-penalty').value,
        reminder_time: document.getElementById('s-remind').value, celebrate_light: document.getElementById('s-light').value,
        lang: document.getElementById('s-lang').value, streak_bonus: document.getElementById('s-streak').value, boss_hp: document.getElementById('s-bosshp').value, boss_bonus: document.getElementById('s-bossbonus').value,
        trading: document.getElementById('s-trading').checked,
          weekly_summary: document.getElementById('s-summary').checked
      };
      var ft = document.getElementById('s-ft').value, fa = document.getElementById('s-fa').value, fam = state.family;
      if (!fam ? (ft || fa) : (ft !== fam.title || String(fa) !== String(fam.amount))) { body.family_title = ft; body.family_amount = fa; }
      post('api/settings', body, 'Gemt');
    }
  });
  setInterval(function () { if (!document.hidden && !typing()) { load(); } }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !typing()) { load(); } });
  load();
})();
</script>
</body>
</html>
